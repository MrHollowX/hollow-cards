name: Validate Hollow Cards

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Node.js checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run tests
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        shell: bash
        run: for file in hollow-cards/*.js; do node --check "$file"; done

  validate-hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate as a HACS Dashboard plugin
        uses: hacs/action@main
        with:
          category: plugin
